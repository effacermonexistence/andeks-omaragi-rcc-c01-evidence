name: C01 stored evidence and unchanged-component checks
on:
  push:
    branches: [c01-source-evidence-repair-20261007]
    paths:
      - '.github/workflows/c01-stored-evidence-inspection.yml'
      - 'scripts/reproduce_bounded_adoption.py'
      - 'evidence/source_recovery/**'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact public evidence revision
        env:
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/$REPO.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Compare original source and reproduce unchanged adoption components
        run: python3 scripts/reproduce_bounded_adoption.py
